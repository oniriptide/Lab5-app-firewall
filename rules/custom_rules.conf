# Enable ModSecurity Engine and Allow Request Body Access
SecRuleEngine On
SecRequestBodyAccess On

# TODO: Add your custom rules below

# Detect malformed content-type header
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data\s*,\s*boundary=" \
"id:100002,phase:1,deny,status:403,log,msg:'Custom Rule: Malformed multipart Content-Type header detected'"

# Detect PHP upload progress parameter
SecRule ARGS:php_session_upload_progress "@streq exploit_payload" \
"id:100003,phase:2,deny,status:403,log,msg:'Custom Rule: Suspicious PHP session upload progress parameter detected'"
